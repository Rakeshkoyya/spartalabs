<!doctype html>
<!--
  Source for public/og.png — the card every shared link renders.

  Regenerate by opening this file at exactly 1200x630 and screenshotting it,
  e.g. with any headless browser at that viewport. Kept as HTML rather than
  generated at runtime so the card costs nothing to serve and always matches
  the type and colour in src/app/globals.css.
-->
<html lang="en-IN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #0B0C0E; color: #F2F0ED;
    font-family: "Archivo", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 68px 72px;
  }
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(242,240,237,.055) 1px, transparent 1px),
      linear-gradient(90deg, rgba(242,240,237,.055) 1px, transparent 1px);
    background-size: 64px 64px;
    -webkit-mask-image: radial-gradient(112% 88% at 16% 6%, #000 6%, transparent 72%);
  }
  .glow {
    position: absolute; top: -22%; right: -12%; width: 720px; height: 720px;
    background: radial-gradient(circle, rgba(192,122,60,.30), transparent 62%);
  }
  .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
  .brand svg { width: 22px; height: 26px; }
  .mono { font-family: "IBM Plex Mono", monospace; font-weight: 500; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: #A8ADB6; }
  h1 {
    position: relative; font-size: 76px; font-weight: 700; line-height: 1.02;
    letter-spacing: -.035em;
  }
  h1 span { color: #E09A5B; }
  .foot { position: relative; border-top: 1px solid rgba(242,240,237,.12); padding-top: 26px; }
  .sectors { color: #A8ADB6; }
  .sectors b { color: #E09A5B; font-weight: 500; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>

  <div class="row">
    <div class="brand">
      <svg viewBox="0 0 13 15" fill="none" aria-hidden="true">
        <path d="M1 1.2 6.5 7.5 1 13.8M6.5 1.2 12 7.5 6.5 13.8" stroke="#C07A3C" stroke-width="1.7" stroke-linecap="square"/>
      </svg>
      Sparta Labs
    </div>
    <span class="mono">Software engineering studio · India</span>
  </div>

  <!-- Explicit breaks: the canvas is a fixed 1200x630, so there is nothing to reflow for. -->
  <h1>We build the systems<br>your organisation<br><span>runs on.</span></h1>

  <div class="foot row">
    <span class="mono sectors">Education <b>·</b> Film &amp; media <b>·</b> Advertising <b>·</b> Operations</span>
    <span class="mono">spartalabs.in</span>
  </div>
</body>
</html>
