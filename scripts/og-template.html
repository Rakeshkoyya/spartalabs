<!doctype html>
<!--
  Source for public/og.png — the card every shared link renders.

  Regenerate by opening this file at exactly 1200x630 and screenshotting it,
  e.g. with any headless browser at that viewport. Kept as HTML rather than
  generated at runtime so the card costs nothing to serve and always matches
  the type and colour in src/app/globals.css and the client brochure.
-->
<html lang="en-IN">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&display=swap">
<!-- Offline fallback: the same faces, bundled with the brochure sources. -->
<link rel="stylesheet" href="../brochure/source/fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background:
      radial-gradient(120% 90% at 100% 0%, rgba(0,82,209,.55), transparent 55%),
      radial-gradient(90% 70% at 0% 100%, rgba(0,70,184,.3), transparent 60%),
      #060D1A;
    color: #fff; font-family: "Outfit", system-ui, sans-serif;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 64px 72px;
  }
  .mark { position: absolute; right: -40px; top: 70px; width: 400px; filter: drop-shadow(0 30px 60px rgba(0,40,120,.6)); }
  .row { position: relative; display: flex; align-items: center; justify-content: space-between; }
  .wordmark { height: 46px; }
  .label { font-weight: 500; font-size: 15px; letter-spacing: .2em; text-transform: uppercase; color: #7F93B3; }
  h1 { position: relative; font-size: 72px; font-weight: 600; line-height: 1.02; letter-spacing: -.03em; width: 760px; }
  h1 span { color: #4DBBFF; }
  .foot { position: relative; border-top: 1px solid rgba(255,255,255,.12); padding-top: 24px; }
  .foot b { color: #19BEFF; font-weight: 500; }
</style>
</head>
<body>
  <img class="mark" src="../public/brand/logo-mark-white.png" alt="">

  <div class="row">
    <img class="wordmark" src="../public/brand/logo-wordmark-white.png" alt="Sparta Labs">
  </div>

  <!-- Explicit breaks: the canvas is a fixed 1200x630, so there is nothing to reflow for. -->
  <h1>Software built around<br><span>how your business</span><br>actually runs.</h1>

  <div class="foot row">
    <span class="label">Websites <b>|</b> Apps <b>|</b> AI Automations <b>|</b> AI Solutions</span>
    <span class="label">spartalabs.in</span>
  </div>
</body>
</html>
